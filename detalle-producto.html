<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Detalle de Producto</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="bg-dark border-bottom border-info py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-info fs-4" href="index.html">🎮 LEVEL-UP GAMER</a>
            <nav class="d-flex gap-3 mt-2 mt-md-0 align-items-center">
                <a class="text-light text-decoration-none" href="index.html">Inicio</a>
                <a class="text-light text-decoration-none" href="productos.html">Catálogo</a>
                <a class="text-light text-decoration-none" href="nosotros.html">Nosotros</a>
                <a class="text-light text-decoration-none" href="contacto.html">Soporte</a>
                <a class="text-light text-decoration-none" href="blogs.html">Blogs</a>
                <a class="btn btn-primary btn-sm fw-bold" href="login.html">Ingresar</a>
                <a class="btn btn-success btn-sm fw-bold" href="registro.html">Registrarse</a>
            </nav>
        </div>
    </header>

    <!-- DETALLE DEL PRODUCTO -->
    <main class="container my-5">
        <a href="productos.html" class="btn btn-outline-secondary btn-sm mb-4">← Volver al Catálogo</a>

        <div class="row g-5">
            <!-- Columna Izquierda: Imagen del Producto -->
            <div class="col-12 col-md-6 text-center">
                <!-- id="producto-imagen": Alonso cambiará el src y alt con JS -->
                <img id="producto-imagen" src="https://images.unsplash.com/photo-1587202372775-e229f172b9d7?q=80&w=600" class="img-fluid rounded border border-secondary" alt="Cargando...">
            </div>

            <!-- Columna Derecha: Información y Compra -->
            <div class="col-12 col-md-6">
                <!-- id="producto-categoria": Alonso cambiará el texto y color con JS -->
                <span id="producto-categoria" class="badge bg-info text-dark mb-2">Cargando...</span>
                
                <!-- id="producto-nombre": Alonso cambiará el nombre con JS -->
                <h1 id="producto-nombre" class="fw-bold text-white mb-3">Cargando Producto...</h1>
                
                <!-- id="producto-precio": Alonso cambiará el precio con JS -->
                <p class="fs-3 fw-bold text-info mb-4"><span id="producto-precio">$0</span> <span class="fs-6 text-secondary fw-normal">CLP</span></p>
                
                <h5 class="fw-bold text-light border-bottom border-secondary pb-2">Especificaciones Técnicas:</h5>
                
                <!-- id="producto-specifications": Alonso inyectará los <li> dinámicamente -->
                <ul id="producto-specifications" class="text-secondary ps-3 mb-4">
                    <li>Cargando especificaciones técnicas...</li>
                </ul>

                <!-- Botones de Acción -->
                <div class="d-flex gap-3">
                    <button class="btn btn-info text-white fw-bold btn-lg flex-grow-1">Añadir al Carrito</button>
                    <button class="btn btn-outline-success btn-lg">⭐ Favorito</button>
                </div>
            </div>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-secondary text-center py-4 border-top border-secondary mt-auto">
        <p class="mb-0 small">&copy; 2026 Level-Up Gamer.</p>
    </footer>

    <!-- Cargamos la base de datos de productos -->
    <script src="assets/js/productos.js"></script>
    <!-- Cargamos la lógica del detalle -->
    <script src="assets/js/detalle.js"></script>

    <!-- link de css -->
    <link rel="stylesheet" href="assets/css/styles.css">

</body>
</html>
