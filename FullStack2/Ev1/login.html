<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Iniciar Sesión</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="bg-dark border-bottom border-info py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-info fs-4" href="index.html">🎮 LEVEL-UP GAMER</a>
            <nav class="d-flex gap-3 mt-2 mt-md-0 align-items-center">
                <a class="text-light text-decoration-none" href="index.html">Inicio</a>
                <a class="text-light text-decoration-none" href="productos.html">Catálogo</a>
                <a class="text-light text-decoration-none" href="nosotros.html">Nosotros</a>
                <a class="text-light text-decoration-none" href="contacto.html">Soporte</a>
                <a class="text-light text-decoration-none" href="blogs.html">Blogs</a>
                <a class="btn btn-primary btn-sm fw-bold" href="login.html">Ingresar</a>
                <a class="btn btn-success btn-sm fw-bold" href="registro.html">Registrarse</a>
            </nav>
        </div>
    </header>

    <!-- FORMULARIO DE LOGIN -->
    <main class="container my-5" style="max-width: 450px;">
        <div class="text-center mb-4">
            <h2 class="text-info fw-bold">INICIAR SESIÓN</h2>
            <p class="text-secondary">Ingresa a tu cuenta de socio o administrador.</p>
        </div>

        <!-- Tarjeta de Login -->
        <div class="card bg-dark text-light border-secondary p-4">
            <form id="formLogin" action="#" method="POST">
                
                <!-- Correo o Usuario -->
                <div class="mb-3">
                    <label for="loginCorreo" class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control bg-black text-light border-secondary" id="loginCorreo" placeholder="ejemplo@duoc.cl" required>
                </div>

                <!-- Contraseña -->
                <div class="mb-3">
                    <label for="loginContrasena" class="form-label fw-bold">Contraseña</label>
                    <input type="password" class="form-control bg-black text-light border-secondary" id="loginContrasena" required>
                </div>

                <!-- Recordar sesión -->
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input bg-black border-secondary" id="recordar">
                    <label class="form-check-label text-secondary small" for="recordar">Recordar mi sesión</label>
                </div>

                <!-- Botón de Envío -->
                <button type="submit" class="btn btn-info w-100 text-white fw-bold mt-2">INGRESAR</button>

                <div class="text-center mt-3">
                    <p class="small text-secondary mb-0">¿No tienes cuenta? <a href="registro.html" class="text-success text-decoration-none fw-bold">Regístrate aquí</a></p>
                </div>
            </form>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-secondary text-center py-4 border-top border-secondary mt-auto">
        <p class="mb-0 small">&copy; 2026 Level-Up Gamer.</p>
    </footer>

    <!-- link de css -->
    <link rel="stylesheet" href="assets/css/styles.css">

</body>
</html>
