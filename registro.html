<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Registro de Socio</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="bg-dark border-bottom border-info py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-info fs-4" href="index.html">🎮 LEVEL-UP GAMER</a>
            <nav class="d-flex gap-3 mt-2 mt-md-0 align-items-center">
                <a class="text-light text-decoration-none" href="index.html">Inicio</a>
                <a class="text-light text-decoration-none" href="productos.html">Catálogo</a>
                <a class="text-light text-decoration-none" href="nosotros.html">Nosotros</a>
                <a class="text-light text-decoration-none" href="contacto.html">Soporte</a>
                <a class="text-light text-decoration-none" href="blogs.html">Blogs</a>
                <a class="btn btn-primary btn-sm fw-bold" href="login.html">Ingresar</a>
                <a class="btn btn-success btn-sm fw-bold" href="registro.html">Registrarse</a>
            </nav>
        </div>
    </header>

    <!-- FORMULARIO DE REGISTRO -->
    <main class="container my-5" style="max-width: 700px;">
        <div class="text-center mb-4">
            <h2 class="text-success fw-bold">ÚNETE A LA COMUNIDAD</h2>
            <p class="text-secondary">Regístrate como socio para acumular puntos LevelUp y obtener un 20% de descuento si usas tu correo Duoc.</p>
        </div>

        <!-- Caja contenedora -->
        <div class="card bg-dark text-light border-secondary p-4">
            <form id="formRegistro" action="#" method="POST">
                
                <div class="row g-3">
                    <!-- RUN -->
                    <div class="col-12 col-md-6">
                        <label for="run" class="form-label fw-bold">RUN <span class="text-secondary small">(Sin puntos ni guion)</span></label>
                        <input type="text" class="form-control bg-black text-light border-secondary" id="run" placeholder="12345678K" required>
                        <!-- Contenedor del mensaje de error en tiempo real -->
                        <span id="error-run" class="text-danger small mt-1" style="display: none;"></span>
                    </div>

                    <!-- Fecha de Nacimiento -->
                    <div class="col-md-6 mb-3">
                        <label for="txtFechaNac" class="form-label text-light">Fecha de Nacimiento</label>
                        <input type="date" class="form-control bg-dark text-light border-secondary" id="txtFechaNac" required>
                        <span id="error-fecha" class="text-danger small mt-1" style="display: none;"></span>
                    </div>

                    <!-- Nombre -->
                    <div class="col-12 col-md-6">
                        <label for="nombre" class="form-label fw-bold">Nombre</label>
                        <input type="text" class="form-control bg-black text-light border-secondary" id="nombre" required>
                    </div>

                    <!-- Apellidos -->
                    <div class="col-12 col-md-6">
                        <label for="apellidos" class="form-label fw-bold">Apellidos</label>
                        <input type="text" class="form-control bg-black text-light border-secondary" id="apellidos" required>
                    </div>

                    <!-- Correo Electrónico -->
                    <div class="col-12">
                        <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                        <input type="email" class="form-control bg-black text-light border-secondary" id="correo" placeholder="ejemplo@duoc.cl" required>
                        <!-- Contenedor del mensaje de error en tiempo real -->
                        <span id="error-correo" class="text-danger small mt-1" style="display: none;"></span>
                    </div>

                    <!-- Contraseña -->
                    <div class="col-12 col-md-6">
                        <label for="contrasena" class="form-label fw-bold">Contraseña <span class="text-secondary small"> (4-10 caracteres)</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control bg-black text-light border-secondary" id="contrasena" placeholder="Entre 4 y 10 caracteres" required>
                            <!-- Notar el ID único -->
                            <button class="btn btn-outline-secondary bg-black" type="button" id="btn-ojito-contrasena">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <span id="error-contrasena" class="text-danger small mt-1" style="display: none;"></span>
                    </div>

                    <!-- Confirmar Contraseña -->
                    <div class="col-12 col-md-6">
                        <label for="confirmarContrasena" class="form-label fw-bold">Confirmar Contraseña</label>
                        <div class="input-group">
                            <input type="password" class="form-control bg-black text-light border-secondary" id="confirmarContrasena" placeholder="Confirma tu contraseña" required>
                            <!-- Notar el ID único -->
                            <button class="btn btn-outline-secondary bg-black" type="button" id="btn-ojito-confirmar">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </button>
                        </div>
                        <span id="error-confirmarContrasena" class="text-danger small mt-1" style="display: none;"></span>
                    </div>

                    <!-- Región -->
                        <div class="col-12 col-md-6">
                            <label for="region" class="form-label fw-bold">Región</label>
                            <select class="form-select bg-black text-light border-secondary" id="region" required>
                                
                            </select>
                        </div>

                        <!-- Comuna -->
                        <div class="col-12 col-md-6">
                            <label for="comuna" class="form-label fw-bold">Comuna</label>
                            <select class="form-select bg-black text-light border-secondary" id="comuna" required>
                                <option value="">-- Selecciona Comuna --</option>
                                
                            </select>
                        </div>

                    <!-- Dirección -->
                    <div class="col-12">
                        <label for="direccion" class="form-label fw-bold">Dirección de Despacho</label>
                        <input type="text" class="form-control bg-black text-light border-secondary" id="direccion" placeholder="Calle, número, departamento" required>
                    </div>
                </div>

                <button type="submit" class="btn btn-success w-100 text-dark fw-bold mt-4">REGISTRARSE</button>
            </form>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-secondary text-center py-4 border-top border-secondary mt-auto">
        <p class="mb-0 small">&copy; 2026 Level-Up Gamer.</p>
    </footer>

    <script src="assets/js/registro.js"></script>
    <!-- link de css -->
    <link rel="stylesheet" href="assets/css/styles.css">

</body>
</html>
