<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Level-Up Gamer | Soporte</title>
    <!-- CSS de Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-black text-light">

    <!-- CABECERA Y NAVEGACIÓN -->
    <header class="bg-dark border-bottom border-info py-3">
        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">
            <a class="navbar-brand fw-bold text-info fs-4" href="index.html">🎮 LEVEL-UP GAMER</a>
            <nav class="d-flex gap-3 mt-2 mt-md-0 align-items-center">
                <a class="text-light text-decoration-none" href="index.html">Inicio</a>
                <a class="text-light text-decoration-none" href="productos.html">Catálogo</a>
                <a class="text-light text-decoration-none" href="nosotros.html">Nosotros</a>
                <a class="text-info fw-bold text-decoration-none" href="contacto.html">Soporte</a>
                <a class="text-light text-decoration-none" href="blogs.html">Blogs</a>
                <!-- NUEVO: Enlace directo al inicio de sesión -->
                <a class="btn btn-primary btn-sm fw-bold" href="login.html">Ingresar</a>
                <!-- Botón verde para registrarse -->
                <a class="btn btn-success btn-sm fw-bold" href="registro.html">Registrarse</a>
            </nav>
        </div>
    </header>

    <!-- FORMULARIO DE SOPORTE -->
    <main class="container my-5" style="max-width: 600px;">
        <div class="text-center mb-4">
            <h2 class="text-info fw-bold">SOPORTE Y CONTACTO</h2>
            <p class="text-secondary">¿Tienes dudas o algún problema técnico? Escríbenos.</p>
        </div>

        <!-- Caja contenedora del formulario -->
        <div class="card bg-dark text-light border-secondary p-4">
            <form action="#" method="POST">
                
                <div class="mb-3">
                    <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                    <input type="text" class="form-control bg-black text-light border-secondary" id="nombre" required>
                </div>

                <div class="mb-3">
                    <label for="correo" class="form-label fw-bold">Correo Electrónico</label>
                    <input type="email" class="form-control bg-black text-light border-secondary" id="correo" required>
                </div>

                <div class="mb-3">
                    <label for="motivo" class="form-label fw-bold">Motivo de la consulta</label>
                    <select class="form-select bg-black text-light border-secondary" id="motivo">
                        <option value="soporte">Soporte Técnico</option>
                        <option value="ventas">Dudas sobre Ventas</option>
                        <option value="reclamo">Reclamos</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="mensaje" class="form-label fw-bold">Mensaje</label>
                    <textarea class="form-control bg-black text-light border-secondary" id="mensaje" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn btn-info w-100 text-white fw-bold">Enviar Mensaje</button>
            </form>
        </div>
    </main>

    <!-- PIE DE PÁGINA -->
    <footer class="bg-dark text-secondary text-center py-4 border-top border-secondary mt-auto">
        <p class="mb-0 small">&copy; 2026 Level-Up Gamer.</p>
    </footer>

    <!-- link de css -->
    <link rel="stylesheet" href="assets/css/styles.css">

</body>
</html>
